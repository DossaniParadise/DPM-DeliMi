<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Paradise Deli · Menu Editor</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
  /* ======================================================================
     Paradise Deli — menu editor. Draws the menu like the TV does; tap anything
     to change it. Self-contained (no other files needed).
     ====================================================================== */
  :root {
    --orange: #F39323; --bg: #0b0b0c; --card: #1b1b1e; --card2: #26262b; --line: #34343a;
    --ink: #f4f4f4; --dim: #9a9aa3; --red: #e5484d; --green: #3fb950;
    --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .btn { border: 1px solid var(--line); background: var(--card2); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #000; }
  .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .info { color: var(--dim); font-size: 13px; }
  .err { color: var(--red); font-size: 14px; margin: 8px 0; }

  /* ---- top bar ---- */
  .top { position: sticky; top: 0; z-index: 20; background: #000; border-bottom: 1px solid var(--line); }
  .top .row1 { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .top .row1 img { height: 26px; }
  .top select { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 9px 10px; font-weight: 600; }
  .top .row2 { display: flex; align-items: center; gap: 6px; padding: 0 10px 8px; overflow-x: auto; scrollbar-width: none; }
  .top .row2::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--dim); border-radius: 999px; padding: 6px 13px; font-weight: 600; font-size: 14px; white-space: nowrap; }
  .chip.active { background: var(--orange); border-color: var(--orange); color: #000; }
  .chip.ghost { border-style: dashed; }
  .top .spacer { flex: 1; }

  /* ---- login / messages ---- */
  .login { max-width: 380px; margin: 10vh auto; padding: 0 20px; }
  .login h1 { text-align: center; font-size: 20px; margin: 0 0 20px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 12px; font-size: 16px; }
  .field input:focus { outline: 2px solid var(--orange); border-color: transparent; }

  /* ---- the board: same look as the TV ---- */
  .stage { padding: 10px 10px 120px; max-width: 1100px; margin: 0 auto; }
  .board { --u: 1px; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222; position: relative; }
  .hdr { height: calc(var(--u) * 150); display: flex; align-items: center; justify-content: center; position: relative;
    background: linear-gradient(180deg, #a9dcf3 0%, #bfe6f7 60%, #dff3fb 100%); }
  .hdr img { height: 70%; max-width: 60%; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  .hdr .textlogo { display: none; font-weight: 800; font-size: calc(var(--u) * 54); color: var(--orange); letter-spacing: .06em; -webkit-text-stroke: .04em #1a1a1a; text-shadow: 0 .08em 0 #1a1a1a; text-align: center; line-height: 1; }
  .hdr .textlogo small { display: block; font-size: .4em; letter-spacing: .3em; }
  .hdr.nologo img { display: none; } .hdr.nologo .textlogo { display: block; }
  .hdr .store { position: absolute; right: calc(var(--u) * 20); bottom: calc(var(--u) * 8); font-size: calc(var(--u) * 15); font-weight: 600; color: #1b3a4b; background: rgba(255,255,255,.65); padding: .2em .7em; border-radius: 999px; }
  .body { position: relative; padding: calc(var(--u) * 18) calc(var(--u) * 28) calc(var(--u) * 18) calc(var(--u) * 34); }
  .body::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--u) * 14); background: var(--orange); }
  .menu { display: grid; grid-template-columns: 1fr; gap: 0 calc(var(--u) * 40); }
  .board.wide .menu { grid-template-columns: 1fr 1fr; }
  .cat { margin-bottom: calc(var(--u) * 22); break-inside: avoid; }
  .cat h2 { margin: 0; text-align: center; color: var(--orange); text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
    font-size: calc(var(--u) * 30); line-height: 1.15; border-bottom: calc(var(--u) * 4) solid var(--orange); padding: .1em .3em .12em; border-radius: 4px 4px 0 0; }
  .cat .note { font-style: italic; color: #cfcfcf; font-size: calc(var(--u) * 16); margin: .3em 0 .4em; text-align: center; padding: 0 .3em; }
  .item { display: flex; align-items: baseline; gap: .6em; font-size: calc(var(--u) * 21); line-height: 1.35; padding: .18em .3em; border-radius: 6px; }
  .item .name { flex: 1 1 auto; font-weight: 500; }
  .item .dots { flex: 1 1 auto; border-bottom: 2px dotted #444; transform: translateY(-.35em); min-width: 1em; }
  .item .price { flex: 0 0 auto; font-weight: 700; white-space: nowrap; letter-spacing: .04em; }
  .item .desc { display: block; font-weight: 400; color: #cfcfcf; font-size: .78em; line-height: 1.25; }
  .item.is-hidden { opacity: .35; }
  .item.is-hidden .name::before { content: "🚫 "; }
  .item .ovr { font-size: .55em; color: var(--orange); vertical-align: middle; margin-left: .5em; font-weight: 700; }
  .screen-note { text-align: center; color: var(--orange); font-weight: 700; font-size: calc(var(--u) * 22); padding: .4em; border-radius: 6px; }
  /* tap affordances */
  .tap { cursor: pointer; }
  .tap:hover, .tap:active { background: rgba(243,147,35,.16); }
  .cat h2.tap:hover, .cat h2.tap:active { background: rgba(243,147,35,.25); }
  .ghostline { color: #666; font-size: calc(var(--u) * 17); font-style: italic; padding: .3em .4em; border: 1px dashed #333; border-radius: 6px; margin-top: .3em; cursor: pointer; }
  .ghostline:hover, .ghostline:active { color: var(--orange); border-color: var(--orange); }
  .ghostcat { text-align: center; color: #666; border: 1px dashed #333; border-radius: 8px; padding: .6em; font-size: calc(var(--u) * 20); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; margin-top: calc(var(--u) * 10); }
  .ghostcat:hover, .ghostcat:active { color: var(--orange); border-color: var(--orange); }
  .sortable-ghost { opacity: .3; } .sortable-chosen { background: rgba(243,147,35,.25); }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px dashed #333; align-items: center; }
  .photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 2px solid #333; cursor: pointer; }
  .photos .lbl { font-size: 12px; color: var(--dim); width: 100%; }
  .empty { text-align: center; color: var(--dim); padding: 40px 16px; }

  /* ---- bottom action bar ---- */
  .actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.92); border-top: 1px solid var(--line); overflow-x: auto; }
  .actions .btn { flex: 0 0 auto; white-space: nowrap; }

  /* ---- sheets ---- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: var(--card); border-radius: 18px 18px 0 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); border-top: 3px solid var(--orange); }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .sheet .btns .btn { flex: 1; }
  .sheet .btns .btn.grow2 { flex: 2; }
  .sheet .rowbtns { display: flex; gap: 8px; margin-top: 8px; }
  .sheet .rowbtns .btn { flex: 1; }
  .scope { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 8px; }
  .scope label { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; }
  .scope label.on { border-color: var(--orange); background: #241a0c; }
  .scope small { display: block; color: var(--dim); font-size: 12px; }
  .switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .switch input { width: 22px; height: 22px; }
  .sugg { border: 1px solid var(--line); border-radius: 10px; max-height: 32vh; overflow: auto; margin-top: -6px; margin-bottom: 10px; }
  .sugg div { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
  .sugg div:hover { background: var(--card2); }
  .sugg div span:last-child { color: var(--dim); }
  .sugg .new { color: var(--orange); font-weight: 600; }

  /* ---- TV preview / photo placement ---- */
  .tv-bg { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  .tv-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #111; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tv-bar .info { flex: 1; }
  .tv-bar input[type=file] { display: none; }
  .tv-box { flex: 1; position: relative; overflow: hidden; }
  .tv-box iframe, .lay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: top left; background: transparent; }
  .lay .box { position: absolute; touch-action: none; cursor: move; outline: 3px dashed rgba(243,147,35,.55); outline-offset: 4px; }
  .lay .box.sel { outline: 4px solid var(--orange); }
  .lay .box img { display: block; width: 100%; height: auto; border-radius: 15px; pointer-events: none; user-select: none; box-shadow: 0 8px 30px rgba(0,0,0,.65); }
  .lay .box .plabel { position: absolute; left: -42px; top: 50%; transform: translateY(-50%); width: 115px; height: 115px; border-radius: 50%; background: var(--orange); color: #000; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 31px; pointer-events: none; text-align: center; line-height: 1; }
  .lay .box .rs { position: absolute; right: -24px; bottom: -24px; width: 60px; height: 60px; border-radius: 50%; background: var(--orange); border: 4px solid #000; cursor: nwse-resize; touch-action: none; }
  .lay .box .rs::after { content: "⤡"; color: #000; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; height: 100%; }
  .tv-tools { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #111; border-top: 1px solid var(--line); flex-wrap: wrap; min-height: 52px; }
  .tv-tools input[type=text] { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; width: 120px; }

  .toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: #222; color: #fff; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--green); z-index: 60; max-width: 92vw; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .toast.bad { border-color: var(--red); }
</style>
</head>
<body>
  <!-- top bar -->
  <div class="top" id="top">
    <div class="row1">
      <img src="assets/logo.png" alt="" onerror="this.style.display='none'">
      <select id="storeSel" class="hidden"></select>
      <button class="btn small" id="settingsBtn" title="Store & screen settings">⚙</button>
      <button class="btn small hidden" id="logoutBtn">Log out</button>
    </div>
    <div class="row2 hidden" id="screenChips"></div>
  </div>

  <!-- login -->
  <section id="loginView" class="login hidden">
    <h1>Menu Editor · Sign in</h1>
    <form id="loginForm">
      <label class="field"><span>Email</span><input type="email" id="email" autocomplete="username" required></label>
      <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
      <div class="err" id="loginErr"></div>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    </form>
  </section>

  <!-- message -->
  <section id="msgView" class="login hidden"><h1 id="msgTitle"></h1><p class="info" id="msgBody"></p><div style="text-align:center;margin-top:12px"><button class="btn" id="msgRetry">Try again</button></div></section>

  <!-- editor -->
  <section id="editView" class="stage hidden">
    <div class="board" id="board"></div>
  </section>
  <div class="actions hidden" id="actions">
    <button class="btn primary" id="previewBtn">▶ See it on the TV</button>
    <button class="btn" id="photoBtn">📷 Add photo</button>
    <button class="btn" id="addCatBtn">+ Section</button>
  </div>

  <div id="sheetHost"></div>
  <div id="toastHost"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
  import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, onSnapshot, writeBatch, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

  // ------------------------------------------------------------- config --
  const firebaseConfig = {
    apiKey: "AIzaSyDkOgww069J3JxBmV8j-EUyl88goy5QtOY",
    authDomain: "dpm-menu-manager.firebaseapp.com",
    projectId: "dpm-menu-manager",
    storageBucket: "dpm-menu-manager.firebasestorage.app",
    messagingSenderId: "246192582837",
    appId: "1:246192582837:web:a3101bfc960d8cd8f00efc",
  };
  const ALIGNMENT_API_URL = "https://alignment-api-khaki.vercel.app/api/dpm-alignment"; // FindMi: who manages which stores
  const IMGBB_API_KEY = "b733862d15744e2bfaa4329d122f4ba0";                             // photo uploads
  const LOGO_URL = "assets/logo.png";

  const app = initializeApp(firebaseConfig), db = getFirestore(app), auth = getAuth(app);

  // ------------------------------------------------------------ helpers --
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function uid(len = 8) { const ch = "abcdefghijklmnopqrstuvwxyz0123456789"; const a = new Uint8Array(len); crypto.getRandomValues(a); return Array.from(a, b => ch[b % ch.length]).join(""); }
  function slug(name) { return String(name).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || uid(); }
  function storeSort(a, b) { const na = /PQS(\d+)/.exec(a), nb = /PQS(\d+)/.exec(b); if (na && nb) return +na[1] - +nb[1]; if (na) return -1; if (nb) return 1; return a.localeCompare(b); }
  function resolveItem(entry, catalog) {
    if (entry.custom) return { id: entry.id, custom: true, name: entry.name || "", price: entry.price || "", description: entry.description || "", hidden: !!entry.hidden, override: false, missing: false };
    const base = catalog[entry.itemId];
    if (!base) return { id: entry.id, itemId: entry.itemId, name: "(missing item)", price: "", description: "", hidden: !!entry.hidden, override: false, missing: true };
    const override = entry.price != null && entry.price !== "" && entry.price !== base.price;
    return { id: entry.id, itemId: entry.itemId, name: base.name, price: override ? entry.price : (base.price || ""), basePrice: base.price || "",
      description: entry.description ?? base.description ?? "", hidden: !!entry.hidden, override, missing: false };
  }
  function locationIdFromRestaurant(r) {
    if (!r) return null;
    const division = String(r.division || "").toLowerCase(), name = String(r.storeName || ""), num = String(r.storeNumber || "").replace("#", "").trim();
    if (/scarborough travel stop/i.test(name) || /^sts$/i.test(num)) return "STS";
    if (/paradise quick stop/i.test(name)) { const m = /#\s*0*(\d+)/.exec(name); if (m) return "PQS" + parseInt(m[1], 10); }
    if (division === "c-store" && /^\d+$/.test(num)) return "PQS" + parseInt(num, 10);
    return null;
  }
  async function fetchAlignment() {
    const res = await fetch(ALIGNMENT_API_URL + "?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("Alignment API " + res.status);
    return res.json();
  }
  function allowedLocationsFor(al, email, matchName) {
    const directors = al?.directors || {}, coaches = al?.areaCoaches || {}, restaurants = al?.restaurants || {};
    const em = String(email || "").trim().toLowerCase(), nm = String(matchName || "").trim().toLowerCase();
    const hit = p => (p?.email && String(p.email).trim().toLowerCase() === em) || (nm && p?.name && String(p.name).trim().toLowerCase() === nm);
    const dirIds = Object.keys(directors).filter(id => hit(directors[id])), coachIds = Object.keys(coaches).filter(id => hit(coaches[id]));
    const personNames = [...dirIds.map(id => directors[id].name), ...coachIds.map(id => coaches[id].name)];
    const ids = new Set();
    for (const r of Object.values(restaurants)) {
      const locId = locationIdFromRestaurant(r); if (!locId) continue;
      let cl = Array.isArray(r.assignedAreaCoachIds) ? r.assignedAreaCoachIds : (r.assignedAreaCoachIds && typeof r.assignedAreaCoachIds === "object") ? Object.values(r.assignedAreaCoachIds) : (r.assignedAreaCoachId ? [r.assignedAreaCoachId] : []);
      if (dirIds.includes(r.assignedDirectorId) || cl.some(c => coachIds.includes(c))) ids.add(locId);
    }
    return { ids: [...ids].sort(storeSort), personNames };
  }

  // -------------------------------------------------------------- state --
  const S = { user: null, admin: null, allowed: [], all: {}, locId: null, loc: null, si: 0, catalog: {}, unsubLoc: null, unsubCat: null, sortables: [] };
  const params = new URLSearchParams(location.search);
  const views = { login: $("#loginView"), msg: $("#msgView"), edit: $("#editView") };
  function show(name) {
    for (const k in views) views[k].classList.toggle("hidden", k !== name);
    $("#actions").classList.toggle("hidden", name !== "edit");
    $("#storeSel").classList.toggle("hidden", name !== "edit");
    $("#screenChips").classList.toggle("hidden", name !== "edit");
    $("#settingsBtn").classList.toggle("hidden", name !== "edit");
  }
  function message(title, body, retry) {
    $("#msgTitle").textContent = title; $("#msgBody").textContent = body;
    $("#msgRetry").classList.toggle("hidden", !retry); $("#msgRetry").onclick = retry || null; show("msg");
  }
  function toast(text, bad = false, ms = 2600) {
    const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = text;
    $("#toastHost").appendChild(t); setTimeout(() => t.remove(), ms);
  }
  const screen = () => S.loc?.screens?.[S.si];

  // --------------------------------------------------------------- auth --
  $("#loginForm").addEventListener("submit", async e => {
    e.preventDefault(); $("#loginErr").textContent = "";
    try { await signInWithEmailAndPassword(auth, $("#email").value.trim(), $("#password").value); }
    catch (err) {
      const c = err?.code || "";
      $("#loginErr").textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Email or password is incorrect." : /too-many/.test(c) ? "Too many attempts — wait a minute." : "Sign-in failed: " + c;
    }
  });
  $("#logoutBtn").onclick = () => signOut(auth);
  onAuthStateChanged(auth, async user => {
    S.user = user; $("#logoutBtn").classList.toggle("hidden", !user);
    if (!user) { S.unsubLoc?.(); S.unsubCat?.(); S.loc = null; show("login"); return; }
    await bootstrap();
  });

  async function bootstrap() {
    message("Loading…", "Checking your access.");
    let a;
    try { a = await getDoc(doc(db, "admins", S.user.uid)); } catch (e) { return message("Can't read admin record", e.message, bootstrap); }
    if (!a.exists()) return message("Not set up as an editor", `${S.user.email} signed in, but there is no admins/${S.user.uid} record. Ask IT to add it.`);
    S.admin = a.data();
    const ls = await getDocs(collection(db, "locations")); S.all = {}; ls.forEach(d => { S.all[d.id] = d.data(); });
    if (S.admin.role === "super") S.allowed = Object.keys(S.all).sort(storeSort);
    else {
      let al; try { al = await fetchAlignment(); } catch (e) { return message("Couldn't load your stores", "FindMi did not respond (" + e.message + ").", bootstrap); }
      const { ids, personNames } = allowedLocationsFor(al, S.user.email, S.admin.matchName);
      S.allowed = ids.filter(id => S.all[id]);
      if (!personNames.length) return message("No FindMi match", `FindMi has no director or district manager with the email ${S.user.email}.`, bootstrap);
      if (!S.allowed.length) return message("No stores assigned", `FindMi lists ${personNames.join(", ")} but no Paradise Quick Stop stores are assigned.`, bootstrap);
    }
    S.unsubCat?.(); S.unsubCat = onSnapshot(collection(db, "menuItems"), snap => { const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); S.catalog = c; render(); });
    const sel = $("#storeSel");
    sel.innerHTML = S.allowed.map(id => `<option value="${esc(id)}">${esc(S.all[id]?.name || id)}${S.all[id]?.active === false ? " (hidden)" : ""}</option>`).join("");
    const want = (params.get("id") || localStorage.getItem("admin.locId") || "").toUpperCase();
    selectStore(S.allowed.includes(want) ? want : S.allowed[0], parseInt(params.get("screen") || "1", 10) - 1);
    sel.onchange = () => selectStore(sel.value, 0);
    show("edit");
  }
  function selectStore(id, si = 0) {
    S.locId = id; S.si = Math.max(0, si || 0);
    try { localStorage.setItem("admin.locId", id); } catch (e) {}

  // ------------------------------------------------------------- render --

            <span class="dots"></span><span class="price">${esc(it.price) || "<span style='color:#666'>price?</span>"}</span></div>`; }).join("")}

    board.classList.toggle("wide", board.clientWidth > 700);

    $$("[data-img]", board).forEach(el => el.onclick = () => openTV(el.dataset.img));

    // Long-press (touch) or drag (mouse) to reorder items and sections.

        const dom = {}; $$("#menu .items").forEach(u => { dom[u.dataset.cid] = $$(".item", u).map(li => li.dataset.item); });
        mutate(loc => { const s = loc.screens[S.si]; const all = {}; s.categories.forEach(c => (c.items || []).forEach(e => { all[e.id] = e; }));
          s.categories.forEach(c => { c.items = (dom[c.id] || []).map(id => all[id]).filter(Boolean); }); });

  window.addEventListener("resize", () => { if (S.loc && !$("#sheet")) render(); });

  // ------------------------------------------------------------- writes --
  async function mutate(fn, okText) {
    const loc = JSON.parse(JSON.stringify(S.loc || { screens: [] })); loc.screens = loc.screens || [];
    if (fn(loc) === false) return;
    try {
      await setDoc(doc(db, "locations", S.locId), { name: loc.name || S.all[S.locId]?.name || S.locId, active: loc.active !== false, screens: loc.screens, screenCount: loc.screens.length, updatedAt: serverTimestamp(), updatedBy: S.user.email }, { merge: true });
      if (okText) toast(okText);
    } catch (e) { console.error(e); toast("Save failed: " + (e.code || e.message), true, 5000); }
  }
  const findCat = (loc, id) => { const s = loc.screens[S.si]; s.categories = s.categories || []; const c = s.categories.find(c => c.id === id); if (c) c.items = c.items || []; return c; };
  const findEntry = (loc, id) => { for (const c of (loc.screens[S.si]?.categories || [])) for (const e of (c.items || [])) if (e.id === id) return e; return null; };
  const catOf = (loc, entryId) => (loc.screens[S.si]?.categories || []).find(c => (c.items || []).some(e => e.id === entryId));
  function addScreen() { mutate(loc => { loc.screens.push({ id: uid(), title: "", note: "", categories: [] }); S.si = loc.screens.length - 1; }, "New TV screen added"); }

  // Section (category)
  function openCategory(catId) {
    const cat = catId ? findCat(JSON.parse(JSON.stringify(S.loc)), catId) : null;
    const el = sheet(`<h3>${cat ? "Section" : "New section"}</h3>
      <label class="field"><span>Heading (shown on the TV)</span><input id="cName" value="${esc(cat?.name || "")}" placeholder="e.g. Breakfast"></label>
      <label class="field"><span>Small note under the heading (optional)</span><input id="cNote" value="${esc(cat?.note || "")}" placeholder="e.g. Available 10 AM – 4 PM"></label>

      closeSheet();
    };
    if (cat) {

  // Add item: type a name; matching shared items are suggested, otherwise a new one is created.
  function openAddItem(catId) {
    const el = sheet(`<h3>Add item</h3>
      <label class="field"><span>Item name</span><input id="aName" placeholder="e.g. Corn Dog" autocomplete="off"></label>
      <div class="sugg" id="aSugg"></div>

    const list = () => {

      sg.classList.toggle("hidden", !rows.length);
      $$("[data-id]", sg).forEach(r => r.onclick = () => { q.value = S.catalog[r.dataset.id].name; picked = r.dataset.id; if (!pr.value) pr.value = S.catalog[picked].price || ""; sg.classList.add("hidden"); pr.focus(); });
    };
    q.oninput = list; list(); q.focus();
    $("#aSave", el).onclick = async () => {
      const name = q.value.trim(), price = pr.value.trim(); if (!name) return q.focus();

      const entry = { id: uid(), itemId };
      if (S.catalog[itemId] && price && price !== S.catalog[itemId].price) entry.price = price;   // different here than elsewhere → store-only price
      await mutate(loc => { findCat(loc, catId).items.push(entry); }, `Added ${name}`);
      closeSheet();
    };
  }

  // Item: name, price, description, hide, remove, move.
  function openItem(entryId) {
    const entry = findEntry(JSON.parse(JSON.stringify(S.loc)), entryId); if (!entry) return;
    const it = resolveItem(entry, S.catalog);
    const listedAt = it.custom || it.missing ? [] : S.allowed.filter(id => (S.all[id]?.screens || []).some(s => (s.categories || []).some(c => (c.items || []).some(e => e.itemId === it.itemId))));
    const others = listedAt.filter(id => id !== S.locId);
    const el = sheet(`<h3>${esc(it.name)}</h3>
      ${it.missing ? `<p class="err">This item no longer exists. Remove it.</p>` : `
      <label class="field"><span>Name</span><input id="iName" value="${esc(it.name)}"></label>
      <label class="field"><span>Price</span><input id="iPrice" value="${esc(it.price)}" placeholder="$0.00"></label>
      ${others.length ? `<div class="scope">
        <label class="on"><input type="radio" name="scope" value="all" checked><div><b>Change price at all my stores</b><small>${esc(listedAt.join(", "))}</small></div></label>
        <label><input type="radio" name="scope" value="one"><div><b>Only at ${esc(S.loc.name || S.locId)}</b><small>Other stores keep ${esc(it.basePrice || "their price")}.</small></div></label>
      </div>` : ""}
      <label class="field"><span>Small text under the name (optional)</span><input id="iDesc" value="${esc(it.description)}" placeholder="e.g. Pollo y queso"></label>
      <div class="switch"><span>Hide from the TV (keep on the list)</span><input type="checkbox" id="iHidden" ${it.hidden ? "checked" : ""}></div>
      <div class="rowbtns"><button class="btn" id="iUp">↑ Move up</button><button class="btn" id="iDown">↓ Move down</button></div>`}
      <div class="btns"><button class="btn primary grow2" id="iSave" ${it.missing ? "disabled" : ""}>Save</button><button class="btn danger" id="iRemove">Remove</button></div>`);
    $$("input[name=scope]", el).forEach(r => r.onchange = () => $$(".scope label", el).forEach(l => l.classList.toggle("on", $("input", l).checked)));
    const move = d => mutate(loc => { const c = catOf(loc, entryId); const i = c.items.findIndex(e => e.id === entryId), j = i + d; if (j < 0 || j >= c.items.length) return false; [c.items[i], c.items[j]] = [c.items[j], c.items[i]]; });
    $("#iUp", el) && ($("#iUp", el).onclick = () => { move(-1); closeSheet(); });
    $("#iDown", el) && ($("#iDown", el).onclick = () => { move(1); closeSheet(); });
    $("#iRemove", el).onclick = () => { if (!confirm(`Remove "${it.name}" from this TV?`)) return; mutate(loc => { loc.screens[S.si].categories.forEach(c => { c.items = (c.items || []).filter(e => e.id !== entryId); }); }, "Removed"); closeSheet(); };
    $("#iSave", el).onclick = async () => {
      const name = $("#iName", el).value.trim(), price = $("#iPrice", el).value.trim(), desc = $("#iDesc", el).value.trim(), hidden = $("#iHidden", el).checked;
      if (!name) return;
      try {
        if (it.custom) { await mutate(loc => Object.assign(findEntry(loc, entryId), { name, price, description: desc, hidden }), "Saved"); closeSheet(); return; }
        const base = S.catalog[it.itemId] || {}, patch = {};
        if (name !== base.name) patch.name = name;
        if (desc !== (base.description || "")) patch.description = desc;
        const scope = others.length ? $("input[name=scope]:checked", el).value : "all";
        if (scope === "all") {
          // Shared price + clear store-only prices for this item at every store I manage.
          const batch = writeBatch(db);
          batch.update(doc(db, "menuItems", it.itemId), { ...patch, price, updatedAt: serverTimestamp(), updatedBy: S.user.email });
          for (const id of others) {
            const snap = await getDoc(doc(db, "locations", id)); if (!snap.exists()) continue;
            const data = snap.data(); let touched = false;
            (data.screens || []).forEach(s => (s.categories || []).forEach(c => (c.items || []).forEach(e => { if (e.itemId === it.itemId && e.price != null) { delete e.price; touched = true; } })));
            if (touched) batch.set(doc(db, "locations", id), { screens: data.screens, updatedAt: serverTimestamp(), updatedBy: S.user.email }, { merge: true });
          }
          await batch.commit();
          await mutate(loc => { loc.screens.forEach(s => (s.categories || []).forEach(c => (c.items || []).forEach(e => { if (e.itemId === it.itemId) delete e.price; }))); findEntry(loc, entryId).hidden = hidden; });
          toast(others.length ? `${name} is now ${price} at ${listedAt.length} stores` : `Saved ${name}`);
        } else {
          if (Object.keys(patch).length) await updateDoc(doc(db, "menuItems", it.itemId), { ...patch, updatedAt: serverTimestamp(), updatedBy: S.user.email });
          await mutate(loc => { loc.screens.forEach(s => (s.categories || []).forEach(c => (c.items || []).forEach(e => { if (e.itemId === it.itemId) { if (price && price !== base.price) e.price = price; else delete e.price; } }))); findEntry(loc, entryId).hidden = hidden; });
          toast(`${name} is ${price} at this store only`);
        }
        closeSheet();
      } catch (e) { console.error(e); toast("Save failed: " + (e.code || e.message), true, 5000); }
    };
  }

  // Footer note

  // Store & TV settings
  $("#settingsBtn").onclick = () => {
    const sc = screen();
    const el = sheet(`<h3>${esc(S.loc.name || S.locId)}</h3>
      <div class="switch"><span>Store is live <small class="info">(shows in the store list)</small></span><input type="checkbox" id="sActive" ${S.loc.active !== false ? "checked" : ""}></div>
      ${sc ? `<label class="field"><span>Name for TV ${S.si + 1} (only you see this, e.g. “Breakfast board”)</span><input id="sTitle" value="${esc(sc.title || "")}"></label>
      <p class="info">This TV's link: <a href="index.html?id=${esc(S.locId)}&screen=${S.si + 1}" target="_blank">index.html?id=${esc(S.locId)}&screen=${S.si + 1}</a></p>` : ""}

  // -------------------------------------------------------------- imgbb --
  async function uploadToImgbb(file) {
    const blob = await shrink(file, 1400, .85);
    const fd = new FormData(); fd.append("image", blob, "photo.jpg");
    const res = await fetch("https://api.imgbb.com/1/upload?key=" + encodeURIComponent(IMGBB_API_KEY), { method: "POST", body: fd });
    const j = await res.json(); if (!j.success) throw new Error(j.error?.message || "upload error"); return j.data.url;
  }
  const shrink = (file, max, q) => new Promise((ok, no) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? ok(b) : no(new Error("bad image")), "image/jpeg", q); };
    img.onerror = () => no(new Error("Not an image")); img.src = u; });

  // -------------------------------------- TV view: exact preview + photos --
  // Shows the real TV page scaled to fit. Photos are drawn on top as draggable
  // boxes (the TV page hides its own copies via &edit=1). Positions are % of
  // the TV so they land in the same spot on any screen size.
  $("#previewBtn").onclick = () => openTV(null);
  $("#photoBtn").onclick = () => { if (!screen()) return toast("Set up a TV screen first", true); openTV(null, true); };
  function openTV(selectId, pickFile) {
    const si = S.si; let images = JSON.parse(JSON.stringify(screen()?.images || [])); let selId = selectId || null, scale = 1;
    const bg = document.createElement("div"); bg.className = "tv-bg";
    bg.innerHTML = `<div class="tv-bar"><span class="info">${esc(S.loc.name || S.locId)} · TV ${si + 1} — this is what the screen shows</span>
        <label class="btn small">📷 Add photo<input type="file" accept="image/*" id="tvFile"></label>
        <a class="btn small" target="_blank" href="index.html?id=${esc(S.locId)}&screen=${si + 1}">Open ↗</a><button class="btn small primary" id="tvClose">Done</button></div>
      <div class="tv-box"><iframe src="index.html?id=${esc(S.locId)}&screen=${si + 1}&preview=1&edit=1"></iframe><div class="lay" id="lay"></div></div>
      <div class="tv-tools" id="tvTools"></div>`;
    document.body.appendChild(bg);
    const box = $(".tv-box", bg), fr = $("iframe", bg), lay = $("#lay", bg), tools = $("#tvTools", bg);
    const fit = () => { scale = Math.min(box.clientWidth / 1920, box.clientHeight / 1080); const l = (box.clientWidth - 1920 * scale) / 2, t = (box.clientHeight - 1080 * scale) / 2;
      for (const el of [fr, lay]) { el.style.transform = `scale(${scale})`; el.style.left = l + "px"; el.style.top = t + "px"; } };
    fit(); window.addEventListener("resize", fit);
    const save = () => mutate(loc => { loc.screens[si].images = images; });
    function draw() {
      lay.innerHTML = images.map(im => `<div class="box ${im.id === selId ? "sel" : ""}" data-id="${esc(im.id)}" style="left:${im.x * 19.2}px;top:${im.y * 10.8}px;width:${im.w * 19.2}px">
        <img src="${esc(im.url)}" draggable="false" alt="">${im.label ? `<span class="plabel">${esc(im.label)}</span>` : ""}${im.id === selId ? `<span class="rs"></span>` : ""}</div>`).join("");
      $$(".box", lay).forEach(b => { const im = images.find(x => x.id === b.dataset.id); b.addEventListener("pointerdown", e => e.target.classList.contains("rs") ? startResize(e, im) : startDrag(e, im)); });
      const im = images.find(x => x.id === selId);
      tools.innerHTML = im ? `<span class="info">Price bubble:</span><input type="text" id="tvLabel" value="${esc(im.label || "")}" placeholder="$2.49">
          <button class="btn small" id="tvFront">Bring to front</button><button class="btn small danger" id="tvDel">Remove photo</button>`
        : `<span class="info">${images.length ? "Tap a photo to select it. Drag to move, orange corner to resize." : "Tap “Add photo” to put a picture on this TV."}</span>`;
      if (im) {
        $("#tvLabel", tools).onchange = e => { im.label = e.target.value.trim(); draw(); save(); };
        $("#tvFront", tools).onclick = () => { images = images.filter(x => x !== im).concat([im]); draw(); save(); };
        $("#tvDel", tools).onclick = () => { if (!confirm("Remove this photo?")) return; images = images.filter(x => x !== im); selId = null; draw(); save(); };
      }
    }
    function startDrag(e, im) {
      e.preventDefault(); selId = im.id; draw(); const t = $(`.box[data-id="${im.id}"]`, lay);
      const sx = e.clientX, sy = e.clientY, ox = im.x, oy = im.y; let moved = false;
      const mv = ev => { im.x = Math.max(-im.w + 2, Math.min(98, ox + (ev.clientX - sx) / scale / 19.2)); im.y = Math.max(-5, Math.min(97, oy + (ev.clientY - sy) / scale / 10.8)); moved = true; t.style.left = im.x * 19.2 + "px"; t.style.top = im.y * 10.8 + "px"; };
      const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); im.x = +im.x.toFixed(2); im.y = +im.y.toFixed(2); if (moved) save(); };
      window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    }
    function startResize(e, im) {
      e.preventDefault(); e.stopPropagation(); const t = $(`.box[data-id="${im.id}"]`, lay); const sx = e.clientX, ow = im.w;
      const mv = ev => { im.w = Math.max(4, Math.min(80, ow + (ev.clientX - sx) / scale / 19.2)); t.style.width = im.w * 19.2 + "px"; };
      const up = () => { window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); im.w = +im.w.toFixed(2); save(); };
      window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
    }
    lay.addEventListener("pointerdown", e => { if (e.target === lay) { selId = null; draw(); } });
    const fileInput = $("#tvFile", bg);
    fileInput.addEventListener("change", async e => {
      const f = e.target.files[0]; if (!f) return; toast("Uploading photo…", false, 8000);
      try { const url = await uploadToImgbb(f); const im = { id: uid(), url, x: 42, y: 35, w: 16, label: "" }; images.push(im); selId = im.id; draw(); await save(); toast("Photo added — drag it where you want it"); }
      catch (err) { toast("Upload failed: " + err.message, true, 5000); }
      e.target.value = "";
    });
    $("#tvClose", bg).onclick = () => { window.removeEventListener("resize", fit); bg.remove(); render(); };
    draw();
    if (pickFile) fileInput.click();
  }
</script>
</body>
</html>

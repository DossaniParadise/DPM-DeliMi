<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeliMi</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="DeliMi">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* ======================================================================
     Paradise Deli — kiosk display (self-contained: no other files needed)
     Brand tokens (swap here): orange from the logo, black board, sky header.
     ====================================================================== */
  :root {
    --teal: #09E7E8;        /* sticker cyan */
    --teal-deep: #05B9BB;
    --teal-ink: #063536;    /* board background: very dark teal */
    --orange: #F48120;
    --green: #77BF44;
    --green-deep: #387A3C;
    --board: #000000;       /* menu board: black, white text, orange headings — unchanged branding */
    --ink: #ffffff;
    --ink-dim: #cfcfcf;
    --font: 'Poppins', 'Nunito', 'Segoe UI', Arial, sans-serif;
    --font-head: 'Fredoka', 'Nunito', Arial, sans-serif;
    --fs: 1.55vw;   /* base size in vw so 1080p and 4K TVs look alike; JS lowers it if a menu overflows */
    --cols: 2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--board); color: var(--ink); font-family: var(--font); }
  body { display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }

  .hdr {
    flex: 0 0 auto; height: 22vh; position: relative; display: flex; align-items: center; justify-content: center; gap: 2.2vw;
    background: radial-gradient(ellipse at 20% 0%, #5ff0f1 0%, var(--teal) 45%, var(--teal-deep) 100%);
  }
  .hdr::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .9vh; background: var(--orange); }
  .hdr .icon { height: 74%; width: auto; border-radius: 18%; filter: drop-shadow(0 .5vh 1vh rgba(0,0,0,.25)); }
  .hdr .wordmark { font-family: var(--font-head); font-weight: 700; font-size: calc(var(--fs) * 4.2); line-height: 1; color: #fff;
    text-shadow: 0 .06em 0 #1f6d6e, 0 .12em .25em rgba(0,0,0,.25); letter-spacing: .01em; }
  .hdr .wordmark span { color: var(--orange); }
  .hdr .store { position: absolute; right: 1.5vw; bottom: 1.6vh; font-size: calc(var(--fs) * .85); font-weight: 800; font-family: var(--font-head);
    color: #063536; background: rgba(255,255,255,.85); padding: .25em .9em; border-radius: 999px; }
  .board { flex: 1 1 0; min-height: 0; position: relative; padding: 2vh 2.5vw 1.5vh 3vw; overflow: hidden; }
  .board::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.2vw; background: var(--orange); }

  .menu { column-count: var(--cols); column-gap: 3vw; }
  .cat { break-inside: avoid; -webkit-column-break-inside: avoid; margin-bottom: calc(var(--fs) * 1.1); }
  .cat.wide { break-inside: auto; -webkit-column-break-inside: auto; }
  .cat.wide h2, .cat.wide .note { column-span: all; -webkit-column-span: all; }
  .cat h2 {
    margin: 0 0 .35em; text-align: center; color: var(--orange); text-transform: uppercase;
    letter-spacing: .12em; font-weight: 800; font-size: calc(var(--fs) * 1.55); line-height: 1.15;
    border-bottom: .18em solid var(--orange); padding-bottom: .12em;
  }
  .cat .note { font-style: italic; color: var(--ink-dim); font-size: calc(var(--fs) * .85); margin: 0 0 .5em; text-align: center; }
  .item { display: flex; align-items: baseline; gap: .8em; font-size: var(--fs); line-height: 1.35; padding: .08em 0; }
  .item .name { flex: 1 1 auto; font-weight: 500; }
  .item .dots { flex: 1 1 auto; border-bottom: 2px dotted #444; transform: translateY(-.35em); min-width: 1em; }
  .item .price { flex: 0 0 auto; font-weight: 700; white-space: nowrap; letter-spacing: .04em; color: #fff; }
  .item .desc { display: block; font-weight: 400; color: var(--ink-dim); font-size: .78em; line-height: 1.25; }
  .screen-note { text-align: center; color: var(--orange); font-weight: 700; font-size: calc(var(--fs) * 1.05); margin-top: 1vh; }

  /* Floating images placed by the admin "Images" editor. x/y/w are % of the TV. */
  .fimg { position: fixed; z-index: 5; pointer-events: none; }
  .fimg img { display: block; width: 100%; height: auto; border-radius: .8vw; box-shadow: 0 .4vw 1.6vw rgba(0,0,0,.65); }
  .fimg .plabel { position: absolute; left: -2.2vw; top: 50%; transform: translateY(-50%); width: 6vw; height: 6vw; border-radius: 50%;
    background: var(--orange); color: #000; border: .25vw solid #fff; box-shadow: 0 .3vw 1vw rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.6vw; text-align: center; line-height: 1; padding: .3vw; }
  body.edit .fimg { display: none; }

  /* Free layout: sections, note and text boxes are placed by the admin (x/y/w in % of the TV, k = size multiplier). */
  .free { position: fixed; z-index: 3; --k: 1; }
  .cat.free { margin: 0; break-inside: auto; }
  .cat.free[data-cols="2"] { column-count: 2; column-gap: 3vw; }
  .cat.free[data-cols="2"] h2, .cat.free[data-cols="2"] .note { column-span: all; }
  .cat.free h2 { font-size: calc(var(--fs) * 1.55 * var(--k)); }
  .cat.free .note { font-size: calc(var(--fs) * .85 * var(--k)); }
  .cat.free .item { font-size: calc(var(--fs) * var(--k)); }
  .cat.free[data-align="left"] h2, .cat.free[data-align="left"] .note { text-align: left; }
  .cat.free[data-align="right"] h2, .cat.free[data-align="right"] .note { text-align: right; }
  .screen-note.free { margin: 0; font-size: calc(var(--fs) * 1.05 * var(--k)); }
  .ftext { font-size: calc(var(--fs) * 1.1 * var(--k)); font-weight: 600; color: var(--ink); line-height: 1.25; white-space: pre-wrap; }
  .ftext[data-color="orange"] { color: var(--orange); }
  .ftext[data-color="dim"] { color: var(--ink-dim); }
  .ftext[data-color="green"] { color: var(--green); }
  .ftext[data-color="teal"] { color: var(--teal); }
  .ftext[data-align="center"], .screen-note[data-align="center"] { text-align: center; }
  .ftext[data-align="right"], .screen-note[data-align="right"] { text-align: right; }
  .ftext[data-align="left"], .screen-note[data-align="left"] { text-align: left; }
  .cat.free .item .name { text-align: left; } .cat.free .item .price { text-align: right; }
  body.free-layout .board::before { display: none; }
  body.free-layout .rail { position: fixed; left: 0; top: 22vh; bottom: 0; width: 1.2vw; background: var(--orange); }

  .status { position: fixed; left: 1.6vw; bottom: .5vh; font-size: .75vw; color: #555; }
  .status.offline { color: #b36; }
  .admin-link { position: fixed; right: .6vw; bottom: .5vh; font-size: .8vw; color: #444; text-decoration: none; opacity: .7; }
  .admin-link:hover { color: var(--orange); opacity: 1; }
  body.preview .status, body.preview .admin-link { display: none; }

  /* Store picker / messages */
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4vh 6vw; text-align: center; background: #041f20; }
  .center h1 { color: var(--teal); font-family: var(--font-head); font-size: 2.6vw; margin: 0 0 1vh; }
  .center .bigicon { height: 14vh; margin-bottom: 1vh; }
  .center p { color: var(--ink-dim); font-size: 1.2vw; max-width: 60vw; }
  .center .err { color: #ff8a8a; font-family: monospace; font-size: 1vw; white-space: pre-wrap; max-width: 80vw; }
  .picker { display: flex; gap: 1vw; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 2vh; }
  .picker select, .picker button, .center a.btn {
    font: inherit; font-family: var(--font-head); font-size: 1.2vw; padding: .6em 1em; border-radius: .6em; border: 1px solid #14595a; background: #0d4243; color: #fff;
  }
  .picker button, .center a.btn { background: var(--orange); color: #fff; font-weight: 700; border-color: var(--orange); cursor: pointer; text-decoration: none; }
  .screens { display: flex; gap: .6vw; flex-wrap: wrap; justify-content: center; margin-top: 1.5vh; }
  .screens a { padding: .5em 1.1em; background: #0a3536; color: var(--teal); border: 1px solid #14595a; border-radius: 999px; text-decoration: none; font-size: 1.1vw; font-weight: 600; }
  .center .login { margin-top: 3vh; font-size: 1.1vw; }
  .center a { color: var(--orange); }
  @media (max-width: 800px) {
    :root { --fs: 4vw; --cols: 1; }
    .hdr { height: 16vh; }
    .center h1 { font-size: 6vw; } .center p, .center .login { font-size: 3.6vw; max-width: 90vw; }
    .center .err { font-size: 3vw; }
    .picker select, .picker button, .center a.btn { font-size: 4vw; } .screens a { font-size: 3.6vw; }
    .status, .admin-link { font-size: 3vw; }
    body { overflow: auto; }
  }
</style>
</head>

  const app = initializeApp(firebaseConfig);
  let db;
  try {
    // IndexedDB persistence: a kiosk that boots before the network is up shows the last menu it saw.
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    console.warn("Persistent cache unavailable, using memory cache", e);
    db = initializeFirestore(app, { localCache: memoryLocalCache() });
  }

  // -------------------------------------------------------------- Helpers --
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtTime = (d = new Date()) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  function storeSort(a, b) {
    const na = /PQS(\d+)/.exec(a), nb = /PQS(\d+)/.exec(b);
    if (na && nb) return +na[1] - +nb[1];
    if (na) return -1; if (nb) return 1;
    return a.localeCompare(b);
  }
  // Flatten one screen: catalog refs → real items, apply store-only prices.
  function resolveScreen(loc, idx, catalog) {
    const screen = (loc?.screens || [])[idx];
    if (!screen) return null;
    return { ...screen, categories: (screen.categories || []).map(cat => ({ ...cat, items: (cat.items || []).map(entry => {
      if (entry.custom) return { name: entry.name || "", price: entry.price || "", description: entry.description || "", hidden: !!entry.hidden, missing: false };
      const base = catalog[entry.itemId];
      if (!base) return { name: "", price: "", description: "", hidden: true, missing: true };
      const override = entry.price != null && entry.price !== "";
      return { name: base.name, price: override ? entry.price : (base.price || ""), description: entry.description ?? base.description ?? "", hidden: !!entry.hidden, missing: false };
    }) })) };
  }

  const params = new URLSearchParams(location.search);
  const locId = (params.get("id") || "").trim().toUpperCase();
  const screenNo = Math.max(1, parseInt(params.get("screen") || "1", 10) || 1);
  if (params.get("preview") === "1") document.body.classList.add("preview");
  if (params.get("edit") === "1") document.body.classList.add("preview", "edit");   // admin image editor draws the images itself

  const appEl = $("#app"), statusEl = $("#status");
  let locationDoc = null, catalog = null, lastFromCache = false, gotData = false;

  // Surface problems on screen instead of a silent "Loading…".
  function fail(title, detail) {
    appEl.className = "center";
    appEl.innerHTML = `<h1>${esc(title)}</h1><div class="err">${esc(detail || "")}</div><p class="login"><a href="./">Store list</a> · <a href="admin.html">Admin login</a></p>`;
  }
  window.addEventListener("error", e => { if (!gotData) fail("Page error", e.message); });
  window.addEventListener("unhandledrejection", e => { if (!gotData) fail("Error", e.reason?.message || String(e.reason)); });
  setTimeout(() => { if (!gotData) fail("Still connecting to Firestore…", "No data after 10 s. Check: Firestore rules published (public read on locations/menuItems), seed data imported, and this domain not blocked. Open DevTools → Console for details."); }, 10000);

  // ---------------------------------------------------------------- Kiosk --
  if (locId) {
    $("#adminLink").href = `admin.html?id=${encodeURIComponent(locId)}&screen=${screenNo}`;
    onSnapshot(doc(db, "locations", locId), snap => {
      gotData = true; locationDoc = snap.exists() ? snap.data() : false; lastFromCache = snap.metadata.fromCache; render();
    }, err => fail("Firestore error", err.code + ": " + err.message));
    onSnapshot(collection(db, "menuItems"), snap => {
      const c = {}; snap.forEach(d => { c[d.id] = d.data(); }); catalog = c; gotData = true; render();
    }, err => fail("Firestore error", err.code + ": " + err.message));
    scheduleDailyReload();
  } else {
    // No ?id= → dropdown picker + admin login link.
    onSnapshot(query(collection(db, "locations"), where("active", "==", true)), snap => {
      gotData = true;
      // Only stores that are active AND have at least one screen set up.
      const rows = []; snap.forEach(d => { const r = { id: d.id, ...d.data() }; if ((r.screens || []).length) rows.push(r); }); rows.sort((a, b) => storeSort(a.id, b.id));
      appEl.className = "center";
      if (!rows.length) {
        appEl.innerHTML = `<img class="bigicon" src="${ICON}" alt=""><h1>No stores yet</h1><p>No active store has a screen set up. Run <code>seed.html</code> once, or add stores in the admin page.</p><p class="login"><a href="admin.html">Admin login →</a></p>`;
        return;
      }
      appEl.innerHTML = `<img class="bigicon" src="${ICON}" alt=""><h1>DeliMi · Select your store</h1><p>Each TV has its own screen number.</p>
        <div class="picker"><select id="storeSel">${rows.map(r => `<option value="${esc(r.id)}">${esc(r.name || r.id)} (${esc(r.id)})</option>`).join("")}</select>
        <button id="go">Open screen 1</button></div>
        <div class="screens" id="screens"></div>
        <p class="login"><a href="admin.html">Admin login →</a></p>`;
      const sel = $("#storeSel");
      const showScreens = () => {
        const r = rows.find(x => x.id === sel.value);
        $("#screens").innerHTML = (r.screens || []).map((s, i) =>
          `<a href="?id=${esc(r.id)}&screen=${i + 1}">Screen ${i + 1}${s.title ? " · " + esc(s.title) : ""}</a>`).join("");
      };
      sel.onchange = showScreens; showScreens();
      $("#go").onclick = () => { location.href = `?id=${encodeURIComponent(sel.value)}&screen=1`; };
    }, err => fail("Firestore error", err.code + ": " + err.message));
  }

  function render() {
    if (locationDoc === null || catalog === null) return;
    if (locationDoc === false) {
      fail(`Unknown location “${locId}”`, "There is no store with this id."); return;
    }
    const screen = resolveScreen(locationDoc, screenNo - 1, catalog);
    document.title = `${locationDoc.name || locId} · Screen ${screenNo}`;
    if (!screen) {
      appEl.className = "center";
      appEl.innerHTML = `<h1>${esc(locationDoc.name || locId)}</h1><p>Screen ${screenNo} has not been set up yet. Add it in the admin page.</p>`;
      showStatus(`Updated ${fmtTime()}${lastFromCache ? " (offline copy)" : ""}`, lastFromCache);
      return;
    }
    appEl.className = "";
    const free = screen.layout === "free";
    document.body.classList.toggle("free-layout", free);
    const boxStyle = b => `left:${+(b?.x ?? 0)}%;top:${+(b?.y ?? 0)}%;width:${+(b?.w ?? 40)}%;--k:${+(b?.k || 1)}`;
    const catHtml = cat => { const items = cat.items.filter(it => !it.hidden && !it.missing); const b = free ? (cat.box || {}) : null;
      return `<section class="cat ${free ? "free" : (items.length > 14 ? "wide" : "")}" data-cid="${esc(cat.id)}" ${free ? `style="${boxStyle(b)}" data-align="${esc(b.align || "center")}" data-cols="${b.cols === 2 ? 2 : 1}"` : ""}>
          <h2>${esc(cat.name)}</h2>
          ${cat.note ? `<p class="note">${esc(cat.note)}</p>` : ""}
          ${items.map(it => `<div class="item">
            <span class="name">${esc(it.name)}${it.description ? `<span class="desc">${esc(it.description)}</span>` : ""}</span>
            <span class="dots"></span><span class="price">${esc(it.price)}</span></div>`).join("")}
        </section>`; };
    appEl.innerHTML = `
      <div class="hdr"><img class="icon" src="${ICON}" alt=""><div class="wordmark">Deli<span>Mi</span></div>
        <span class="store">${esc(locationDoc.name || locId)}</span></div>
      ${free ? `<div class="rail"></div><div class="board"></div>
        ${screen.categories.map(catHtml).join("")}
        ${screen.note ? `<div class="screen-note free" data-note="1" style="${boxStyle(screen.noteBox || { x: 10, y: 92, w: 80 })}" data-align="${esc(screen.noteBox?.align || "center")}">${esc(screen.note)}</div>` : ""}
        ${(screen.texts || []).map(t => `<div class="ftext free" data-tid="${esc(t.id)}" style="${boxStyle(t)}" data-align="${esc(t.align || "center")}" data-color="${esc(t.color || "white")}">${esc(t.text)}</div>`).join("")}`
      : `<div class="board"><div class="menu">${screen.categories.map(catHtml).join("")}</div>
        ${screen.note ? `<div class="screen-note">${esc(screen.note)}</div>` : ""}</div>`}
      ${(screen.images || []).map(im => `<div class="fimg" style="left:${+im.x || 0}%;top:${+im.y || 0}%;width:${+im.w || 15}%">
        <img src="${esc(im.url)}" alt="">${im.label ? `<span class="plabel">${esc(im.label)}</span>` : ""}</div>`).join("")}`;
    showStatus(`Updated ${fmtTime()}${lastFromCache ? " · showing offline copy" : ""}`, lastFromCache);
    if (free) document.documentElement.style.setProperty("--fs", "1.55vw"); else fitToScreen();
  }

  // Shrink the base font until nothing is clipped (kiosk = no scrolling).
  function fitToScreen() {
    if (window.innerWidth <= 800) return;
    const root = document.documentElement;
    let fs = 1.55; root.style.setProperty("--fs", fs + "vw");
    const board = $(".board"); if (!board) return;
    const limit = () => Math.min(window.innerHeight, board.getBoundingClientRect().bottom) - 12;
    const lowest = () => Math.max(0, ...$$(".item, .cat h2, .cat .note, .screen-note", board).map(el => el.getBoundingClientRect().bottom));
    let guard = 0;
    while (lowest() > limit() && fs > 0.7 && guard++ < 60) { fs -= 0.04; root.style.setProperty("--fs", fs.toFixed(2) + "vw"); }
  }
  window.addEventListener("resize", () => { if (locationDoc && catalog) render(); });

  function showStatus(text, bad) { statusEl.textContent = text; statusEl.classList.toggle("offline", !!bad); }

  function scheduleDailyReload() {
    const now = new Date(), next = new Date(now);
    next.setHours(DAILY_RELOAD_HOUR, 0, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    setTimeout(() => location.reload(), next - now);
  }
</script>
